<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inherasalud</title>
    <link rel="stylesheet" href="/css/stylesficha.css">
</head>
<body>
    <section class="section1">
        <!-- Card con la información del paciente -->
         <h1>Informacion general del paciente</h1>
        <div class="card" id="info">
           <div class="img">
              <img src="../images/cuenta.png" alt="">
           </div>
           <div class="cardcontent">
              <h2>Nombre del paciente: </h2>
              <p id="nombre"></p>
              <h2>Edad:</h2>
              <p id="Edad"></p>
              <h2>Fecha de nacimiento:</h2>
              <p id="fechaNacimiento"></p>
              <h2>Telefono:</h2>
              <p id="telefono"></p>
              <h2>Direccion:</h2>
              <p id="direccion"></p>  
           </div>
        </div>
    </section>
    <section class="section2">
        <h1>Expediente</h1>
        <div class="expedientecontent">
            <div class="content">
                <h2>Antecedentes Patologicos</h2>
                <p id="pat"></p>
                <h2>Antecedentes no Patologicos</h2>
                <p id="no_pat"></p>
            </div>
        </div>
    </section>
    <section class="section3">
        <h2>Consulta</h2>
        <div class="cardconsulta">
            <div class="consulta_content">
                <h1>Padecimiento</h1>
                <p id="pad"></p>
                <h1>Exploracion fisica</h1>
                <p id="exp_fisica"></p>
                <h1>Diagnistico</h1>
                <p id="diag"></p>
                <h1>Tratamiento</h1>
                <p id="trat"></p>
                <h1>Estudios complementarios</h1>
                <p id="est_comp"></p>

            </div>
        </div>
    </section>

</body>
<script src="../js/config.js"></script>
<script type="module" src="../js/fichacita.js"></script>

</html>
