<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/styles3.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="body">
    <div class="sidenav">
        <h1>Nattib Salud</h1>
        <a href="./dashboard.html">Panel administrativo</a>
        <a href="#">Agregar paciente</a>
        <a href="#">Configuracion</a>
        <a href="#">Guia de usuarios</a>
        <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
    </div>
    <div class="main">
        <h1>Agregar paciente</h1>
        <form class="row g-3" id="registrarPacienteForm">
            <div class="col-md-6">
              <label for="nombres" class="form-label">Nombre:</label>
              <input type="text" class="form-control" id="nombres" name="nombres" required>
            </div>
            <div class="col-md-6">
              <label for="apellidos" class="form-label">Apellido:</label>
              <input type="text" class="form-control" id="apellidos" name="apellidos" required>
            </div>
            <div class="col-md-6">
              <label for="fecha_nac" class="form-label">Fecha de nacimiento:</label>
              <input type="date" class="form-control" id="fecha_nac" name="fecha_nac" required>
            </div>
            <div class="col-12">
              <label for="telefono" class="form-label">Numero de telefono</label>
              <input type="text" class="form-control" id="telefono" name="telefono">
            </div>
            <div class="col-md-6">
              <label for="direccion" class="form-label">Direccion</label>
              <input type="text" class="form-control" id="direccion" name="direccion">
            </div>
            
            <div class="col-12">
              <button type="submit" class="btn-1">Registrar</button>
            </div>
          </form>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/agregarpaciente.js"></script>
</body>
</html>
