<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles2.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css" crossorigin="anonymous">
    

</head>
<body class="body">
    <div class="sidenav">
        <h1>Nattib Salud</h1>
        <a href="#">Panel administrativo</a>
        <a href="#">Agregar paciente</a>
        <a href="#">Configuracion</a>
        <a href="#">Guia de usuarios</a>
        <a href="/index.html">Cerrar sesion</a>
    </div>
    <div class="main">
        <h1>Lista de pacientes</h1>
        <div class="tabla">
            <div class="searchbar">
                <button class="addbtn" onclick="window.location.href='agregarpaciente.html' ">
                    <i class="fas fa-solid fa-user-plus" style="color: #ffffff;"></i> Agregar paciente
                </button>
                <input type="text" placeholder="Buscar">
                <button type="submit" class="buscarbtn">Buscar</button>
            </div>
            <table id="myTable" class="display" style="width:100%">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Telefono</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>

    </div>
</body>
<script>
    document.addEventListener('DOMContentLoaded', function(){
        const medico_id = localStorage.getItem('medico_id');
        const apiUrl = 'https://nattib-salud.azurewebsites.net/pacientes/'+ medico_id;

        async function fetchData() {
            try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error('Error al obtener los datos');
            }
            const data = await response.json();
            if (data.success) {
                populateTable(data.pacientes);
            } else {
                console.error('La API no devolvió datos exitosamente');
            }
        } catch (error) {
            console.error('Error:', error);
        }
            
        }

        function populateTable(pacientes) {
        const tbody = document.querySelector('#myTable tbody');
        tbody.innerHTML = ''; // Limpiar el contenido previo

        pacientes.forEach(paciente => {
            const row = document.createElement('tr');

            const nombresCell = document.createElement('td');
            nombresCell.textContent = paciente.nombres;
            row.appendChild(nombresCell);

            const apellidosCell = document.createElement('td');
            apellidosCell.textContent = paciente.apellidos;
            row.appendChild(apellidosCell);

            const telefonoCell = document.createElement('td');
            telefonoCell.textContent = paciente.telefono;
            row.appendChild(telefonoCell);


            tbody.appendChild(row);
        });
    }

    // Llamar a la función para obtener y mostrar los datos
    fetchData();

    });
</script>
</html>
